services:
  frontend:
    image: ghcr.io/baoxinwen/footprint/frontend:main
    ports:
      - "8001:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    image: ghcr.io/baoxinwen/footprint/backend:main
    ports:
      - "8002:8000"
    volumes:
      - ${FOOTPRINT_DATA_DIR:-./data}:/app/footprint-data
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - AMAP_KEY=${AMAP_KEY}
      - AMAP_SECURITY_CODE=${AMAP_SECURITY_CODE:-}
      - DATABASE_URL=sqlite:////app/footprint-data/db/footprint.db
      - UPLOAD_DIR=/app/footprint-data/uploads
      - EXPORT_TMP_DIR=/app/footprint-data/tmp
      - FOOTPRINT_DATA_ROOT=/app/footprint-data
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
