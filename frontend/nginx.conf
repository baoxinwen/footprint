server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # 高德 JS API 运行时仍会动态求值代码；移除 unsafe-eval 会导致地图无法加载。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.amap.com https://*.autonavi.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://*.amap.com https://*.autonavi.com blob:; worker-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Share tokens are credentials and must not appear in access logs.
    location ~ ^/api/shares/(?:view|photo)/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 12M;
        proxy_max_temp_file_size 0;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 12M;
        # 照片/导出 ZIP 为大响应：禁止溢写磁盘缓冲，
        # 避免 read_only 容器的小 tmpfs 被写满导致下载中断
        proxy_max_temp_file_size 0;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA 分享落地页：URL 路径中携带分享 token（等同凭据），禁止进入访问日志。
    # 用正则置于静态资源块之前——nginx 正则按顺序首配即停，
    # 防止 /share/x.js 类带扩展名 URI 被下方资源缓存块抢占（无日志保护且 404）
    location ~ ^/share/ {
        access_log off;
        try_files /index.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
