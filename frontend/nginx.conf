server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 版本号不随 Server 头与默认错误页外露（评审 M-36）
    server_tokens off;

    # 还原来自 Docker 网段内上层代理（如宿主机 HTTPS 反代）的真实客户端 IP：
    # 仅当直连对端属于 172.16.0.0/12 且提供 X-Forwarded-For 时才改写 $remote_addr，
    # 公网直连请求不受影响；下方两处 X-Forwarded-For 覆写仍是防伪造的单条目，
    # 后端据此拿到真实访客 IP 做限流与审计。自定义 Docker 网段时需同步修改。
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # 高德 JS API 运行时仍会动态求值代码；移除 unsafe-eval 会导致地图无法加载。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.amap.com https://*.autonavi.com blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://*.amap.com https://*.autonavi.com blob:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Share tokens are credentials and must not appear in access logs.
    location ~ ^/api/shares/(?:view|photo)/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 12M;
        proxy_max_temp_file_size 0;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 12M;
        # 照片/导出 ZIP 为大响应：禁止溢写磁盘缓冲，
        # 避免 read_only 容器的小 tmpfs 被写满导致下载中断
        proxy_max_temp_file_size 0;
    }

    # PWA manifest：不带内容哈希，不能落入下方一年期的静态资源缓存，否则发版后
    # 浏览器长期拿不到新 manifest。MIME 显式指定——各版本 nginx 的 mime.types 对
    # .webmanifest 收录不一，而全局开着 nosniff。这里不用 add_header，以继承 server 级安全头
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # Service Worker 脚本同理：文件名固定、不带内容哈希，每次发版内容都会变，
    # 落入一年期静态缓存后新的 Service Worker 取不下来。精确匹配优先于下方的正则
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    # 应用壳同理：文件名固定，引用的分块文件名却随发版变化。不显式禁止缓存的话，
    # 浏览器会按启发式规则自行缓存一段时间；而新版本的 Service Worker 安装时要重新取它，
    # 取到旧副本会与构建时记录的校验值不符，导致更新装不上
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA 分享落地页：URL 路径中携带分享 token（等同凭据），禁止进入访问日志。
    # 用正则置于静态资源块之前——nginx 正则按顺序首配即停，
    # 防止 /share/x.js 类带扩展名 URI 被下方资源缓存块抢占（无日志保护且 404）
    location ~ ^/share/ {
        access_log off;
        # 这里是直接出 index.html 而不走内部重定向，命中不了上方 index.html 的规则，
        # 应用壳的不缓存策略要在原地再写一次
        expires -1;
        # 回归（评审 I-22）：落地页自身关掉日志挡不住 Referer——浏览器随后请求
        # /assets/*、favicon 时带着含 token 的 Referer 落进默认日志。
        # 本文档声明 no-referrer 后子资源请求不再携带 Referer。
        # 注意：本块出现 add_header 后不再继承 server 级安全头，必须原地补齐整套
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.amap.com https://*.autonavi.com blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://*.amap.com https://*.autonavi.com blob:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
        try_files /index.html =404;
    }

    # favicon 与图标文件名固定、无内容哈希：一年期 immutable 会让换图标后
    # 老用户最长一年看不到新版（评审 M-31）。用短缓存；本块自带 add_header
    # 后不再继承 server 级安全头，原地补齐整套。必须排在下方一年期块之前
    location ~* ^/(favicon\.svg|icons/) {
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.amap.com https://*.autonavi.com blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://*.amap.com https://*.autonavi.com blob:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Cache static assets。负向前瞻排除 /api/：本块是正则 location，
    # 优先级高于普通前缀 /api/，不加排除的话未来以扩展名结尾的 API 路由
    # （如 /api/export.zip）会被静默截胡成静态 404
    location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        # 本 location 自带 add_header 后不再继承 server 级安全头，
        # 必须在此补齐（CSP/X-Frame 等对静态资源同样生效）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.amap.com https://*.autonavi.com blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://*.amap.com https://*.autonavi.com blob:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
        add_header Cache-Control "public, immutable";
    }
}
