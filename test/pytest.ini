[pytest]
testpaths = unit integration e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --html=reports/report.html --self-contained-html --cov=../backend/app --cov-report=html:reports/coverage
filterwarnings =
    error::pydantic.warnings.PydanticDeprecatedSince20
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    deployed: 需要已运行 Docker 实例的部署验收测试
