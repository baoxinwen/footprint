# Alembic 配置。sqlalchemy.url 留空：运行时由 app.core.migrations
# 或 env.py 从应用设置注入，保证与业务引擎使用同一数据库。

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
